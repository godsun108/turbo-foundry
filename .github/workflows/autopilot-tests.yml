name: Autopilot unit tests
on:
  pull_request:
    paths:
      - 'src/autopilot/**'
      - 'tests/test_missed_call.py'
      - '.github/workflows/autopilot-tests.yml'
  push:
    paths:
      - 'src/autopilot/**'
      - 'tests/test_missed_call.py'
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_missed_call.py' -v
