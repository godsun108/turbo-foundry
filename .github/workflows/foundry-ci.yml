name: Foundry CI

on:
  push:
  pull_request:

# Cancel superseded checks on the same branch or pull request.
concurrency:
  group: foundry-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - name: Verify Foundry core
        run: |
          set -euo pipefail
          test -f README.md
          test -f FOUNDRY_STANDARD.md
          test -f CHANGELOG.md
          test -f SECURITY.md
          test -f templates/project/README.template.md
          grep -q "Build.*measure.*learn.*preserve.*compound" README.md
          echo "Turbo Foundry core verified."
      - name: Verify ecosystem registry
        run: |
          python ecosystem_status.py
          git diff --exit-code -- ECOSYSTEM_STATUS.md
      - name: Verify North Star mission command
        run: |
          python north_star_status.py
          git diff --exit-code -- NORTH_STAR_STATUS.md
      - name: Verify proof receipts
        run: python proof_receipts.py
      - name: Test project generator
        run: python -m unittest discover -s tests -v
      - name: Test Base One Engine
        run: python -m unittest discover -s projects/base-one-engine/tests -v

  music-foundry:
    runs-on: [self-hosted, linux]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Music Foundry tests
        run: python3 -m unittest discover -s music-foundry/tests -v
      - name: Syntax-check private render service
        run: python3 -m py_compile music-foundry/service/server.py
      - name: Verify iPhone control-room JavaScript
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("music-foundry/service/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
          assert scripts, "control room has no inline script"
          Path("/tmp/music-foundry-control-room.js").write_text("\\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/music-foundry-control-room.js
      - name: Render Fine China soulful disco-house instrumental
        run: python3 music-foundry/render_fine_china.py --output music-foundry/output/fine-china-audio --bpm 126
      - name: Validate Fine China arrangement and WAV stems
        run: |
          python3 - <<'PY'
          import json, wave
          from pathlib import Path
          folder = Path("music-foundry/output/fine-china-audio")
          manifest = json.loads((folder / "audio_manifest.json").read_text())
          assert manifest["title"] == "Fine China (Eat On It)"
          assert manifest["bpm"] == 126 and manifest["key_center"] == "A minor"
          assert manifest["chord_progression"] == ["Am", "F", "C", "G"]
          assert manifest["bars"] == 120
          for name in [manifest["mix"], *manifest["stems"]]:
              path = folder / name
              assert path.is_file() and path.stat().st_size > 4096, f"missing/placeholder WAV: {path}"
              with wave.open(str(path), "rb") as audio:
                  assert audio.getnframes() > audio.getframerate() * 180
                  assert audio.getsampwidth() == 2
                  print(f"{name}: {audio.getnchannels()}ch {audio.getframerate()}Hz {audio.getnframes()/audio.getframerate():.2f}s")
          PY
      - name: Publish Fine China instrumental artifact
        uses: actions/upload-artifact@v4
        with:
          name: fine-china-soulful-disco-house-instrumental
          path: music-foundry/output/fine-china-audio/
          retention-days: 7
          if-no-files-found: error
      - name: Render Somebody's Gotta Do It instrumental
        run: |
          python3 music-foundry/render_warehouse_rave_v3.py --output music-foundry/output/somebodys-gotta-do-it-audio --bpm 127
      - name: Validate real WAV output
        run: |
          python3 - <<'PY'
          import json, wave
          from pathlib import Path
          folder = Path("music-foundry/output/somebodys-gotta-do-it-audio")
          manifest = json.loads((folder / "audio_manifest.json").read_text())
          for name in [manifest["mix"], *manifest["stems"]]:
              path = folder / name
              assert path.is_file() and path.stat().st_size > 4096, f"missing/placeholder WAV: {path}"
              with wave.open(str(path), "rb") as audio:
                  assert audio.getnframes() > audio.getframerate() * 10
                  assert audio.getsampwidth() == 2
                  print(f"{name}: {audio.getnchannels()}ch {audio.getframerate()}Hz {audio.getnframes()/audio.getframerate():.2f}s")
          PY
      - name: Render Fine China instrumental
        run: |
          python3 music-foundry/render_fine_china.py --output music-foundry/output/fine-china-audio --bpm 126
      - name: Validate Fine China WAV output
        run: |
          python3 - <<'PY'
          import json, wave
          from pathlib import Path
          folder = Path("music-foundry/output/fine-china-audio")
          manifest = json.loads((folder / "audio_manifest.json").read_text())
          assert manifest["project_id"] == "fine-china"
          assert manifest["bpm"] == 126 and manifest["key_center"] == "A minor"
          assert manifest["chord_progression"] == ["Am", "F", "C", "G"]
          for name in [manifest["mix"], *manifest["stems"]]:
              path = folder / name
              assert path.is_file() and path.stat().st_size > 4096, f"missing/placeholder WAV: {path}"
              with wave.open(str(path), "rb") as audio:
                  assert audio.getnframes() > audio.getframerate() * 200
                  assert audio.getsampwidth() == 2
                  print(f"{name}: {audio.getnchannels()}ch {audio.getframerate()}Hz {audio.getnframes()/audio.getframerate():.2f}s")
          PY
      - name: Publish Fine China instrumental preview
        uses: actions/upload-artifact@v4
        with:
          name: fine-china-instrumental-preview
          path: music-foundry/output/fine-china-audio/
          retention-days: 7
          if-no-files-found: error
      - name: Publish private-review audio artifact
        uses: actions/upload-artifact@v4
        with:
          name: somebodys-gotta-do-it-instrumental-preview
          path: music-foundry/output/somebodys-gotta-do-it-audio/
          retention-days: 7
          if-no-files-found: error
