name: Foundry Gateway Release Rehearsal
on:
  push:
    paths:
      - 'src/autopilot/gateway_*'
      - 'tests/test_autopilot_gateway_*'
      - '.github/workflows/gateway-release-rehearsal.yml'
  pull_request:
    paths:
      - 'src/autopilot/gateway_*'
      - 'tests/test_autopilot_gateway_*'
      - '.github/workflows/gateway-release-rehearsal.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run synthetic release lifecycle
        run: python -m src.autopilot.gateway_release_rehearsal --json gateway-release-evidence.json
      - name: Validate evidence is synthetic and fail closed
        run: |
          python -c 'import json; d=json.load(open("gateway-release-evidence.json")); assert d["passed"] is True; assert d["production_ready"] is False; assert d["live_provider_connected"] is False; assert d["messages_sent"] == 0; assert d["payments_processed"] == 0; assert len(d["checks"]) >= 7'
      - uses: actions/upload-artifact@v4
        with:
          name: foundry-synthetic-gateway-evidence
          path: gateway-release-evidence.json
          retention-days: 7
          if-no-files-found: error
