name: EARTH STUDIO browser foundation

on:
  pull_request:
    paths:
      - "music-foundry/earth-studio/**"
      - "music-foundry/tests/test_earth_studio_session.mjs"
      - ".github/workflows/earth-studio.yml"
  push:
    branches:
      - "earth-studio/**"
    paths:
      - "music-foundry/earth-studio/**"
      - "music-foundry/tests/test_earth_studio_session.mjs"
      - ".github/workflows/earth-studio.yml"

permissions:
  contents: read

jobs:
  browser-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate versioned session schema JSON
        run: node -e "JSON.parse(require('node:fs').readFileSync('music-foundry/earth-studio/session-schema-v1.json','utf8'))"
      - name: Test session validation and serialization
        run: node --test music-foundry/tests/test_earth_studio_session.mjs music-foundry/tests/test_earth_studio_project_package.mjs
      - name: Syntax-check all inline browser scripts
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("music-foundry/earth-studio/art-studio.html").read_text(encoding="utf-8")
          classic = re.findall(r'<script(?![^>]*\\btype=["\\']module["\\'])[^>]*>(.*?)</script>', html, re.S)
          modules = re.findall(r'<script[^>]*\\btype=["\\']module["\\'][^>]*>(.*?)</script>', html, re.S)
          if not classic or not modules:
              raise SystemExit(f"Expected classic and module scripts; found {len(classic)} and {len(modules)}")
          for index, source in enumerate(classic):
              Path(f"/tmp/earth-classic-{index}.js").write_text(source, encoding="utf-8")
          for index, source in enumerate(modules):
              Path(f"/tmp/earth-module-{index}.js").write_text(source, encoding="utf-8")
          PY
          for file in /tmp/earth-classic-*.js; do node --check "$file"; done
          for file in /tmp/earth-module-*.js; do node --check --input-type=module < "$file"; done
      - name: Syntax-check external ES modules
        run: |
          node --check --input-type=module < music-foundry/earth-studio/instrument-adapter.mjs
          node --check --input-type=module < music-foundry/earth-studio/earth-studio-audio-worklet.mjs
