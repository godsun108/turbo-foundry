name: Music Foundry MIDI tests
on:
  push:
    paths:
      - 'music-foundry/**'
      - '.github/workflows/music-foundry.yml'
  pull_request:
    paths:
      - 'music-foundry/**'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python3 -m unittest discover -s music-foundry/tests -v
      - name: Syntax-check browser audio editors
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          files = [
              Path("music-foundry/projects/somebodys-gotta-do-it/recording-booth.html"),
              Path("music-foundry/projects/somebodys-gotta-do-it/vocal-timeline.html"),
          ]
          for source in files:
              html = source.read_text(encoding="utf-8")
              scripts = re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>", html, re.S)
              if not scripts:
                  raise SystemExit(f"No inline script found in {source}")
              Path(f"/tmp/{source.stem}.js").write_text("\\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/recording-booth.js
          node --check /tmp/vocal-timeline.js
      - name: Generate MIDI
        run: python3 music-foundry/generate.py --output music-foundry/output
      - name: Generate Somebody's Gotta Do It arrangement
        run: python3 music-foundry/arrange_project.py --output music-foundry/output/somebodys-gotta-do-it --bpm 127
      - name: Render offline instrumental WAV preview
        run: python3 music-foundry/render_instrumental.py --output music-foundry/output/somebodys-gotta-do-it-audio --bpm 127
      - name: Upload MIDI preview files
        uses: actions/upload-artifact@v4
        with:
          name: music-foundry-midi-demo
          path: music-foundry/output/
