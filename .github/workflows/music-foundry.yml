name: Music Foundry MIDI tests
# Manual-only validation on the repository-owned Linux runner.
# Sovereign-Offline can also invoke music-foundry/run-singing-internal.mjs directly.
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python3 -m unittest discover -s music-foundry/tests -v
      - name: Syntax-check browser audio editors
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          files = [
              Path("music-foundry/projects/somebodys-gotta-do-it/recording-booth.html"),
              Path("music-foundry/projects/somebodys-gotta-do-it/vocal-timeline.html"),
          ]
          for source in files:
              html = source.read_text(encoding="utf-8")
              scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
              if not scripts:
                  raise SystemExit(f"No inline script found in {source}")
              Path(f"/tmp/{source.stem}.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/recording-booth.js
          node --check /tmp/vocal-timeline.js
      - name: Syntax-check vocal score editor module
        run: node --check --input-type=module < music-foundry/projects/somebodys-gotta-do-it/vocal-score-editor.js
      - name: Test SoulX phone inventory
        run: node --test music-foundry/tests/test_soulx_phone_inventory.mjs
      - name: Test source-linked lyric event review
        run: node --test music-foundry/tests/test_lyric_event_review.mjs
      - name: Syntax-check lyric event review and performance bridge modules
        run: |
          node --check --input-type=module < music-foundry/projects/somebodys-gotta-do-it/lyric-event-review.js
          node --check --input-type=module < music-foundry/projects/somebodys-gotta-do-it/lyric-performance-bridge.js
          node --check --input-type=module < music-foundry/projects/somebodys-gotta-do-it/lyric-performance-bridge-core.mjs
          node --test music-foundry/tests/test_lyric_performance_bridge.mjs
      - name: Run Sovereign internal singing validation
        run: node music-foundry/run-singing-internal.mjs
      - name: Syntax-check Genesis Voice Studio modules
        run: |
          node --check music-foundry/projects/somebodys-gotta-do-it/genesis-voice-studio.js
          node --check --input-type=module < music-foundry/projects/somebodys-gotta-do-it/genesis-voice-worker.js
      - name: Build source-linked lyric event manifest
        run: |
          python3 music-foundry/projects/somebodys-gotta-do-it/build_lyric_events.py --output music-foundry/output/somebodys-gotta-do-it/lyric-events.json
          test -s music-foundry/output/somebodys-gotta-do-it/lyric-events.json
      - name: Verify all canonical song performance cues
        run: node --test music-foundry/tests/test_lyric_performance_bridge_integration.mjs
      - name: Test private render service
        run: python3 music-foundry/tests/test_render_service.py -v
      - name: Syntax-check private render service
        run: python3 -m py_compile music-foundry/service/server.py
      - name: Generate MIDI
        run: python3 music-foundry/generate.py --output music-foundry/output
      - name: Generate Somebody's Gotta Do It arrangement
        run: python3 music-foundry/arrange_project.py --output music-foundry/output/somebodys-gotta-do-it --bpm 127
      - name: Generate Warehouse Rave V3 composition MIDI
        run: python3 music-foundry/warehouse_rave_v3.py --output music-foundry/output/warehouse-rave-v3 --bpm 127
      - name: Verify Warehouse Rave V3 MIDI exports
        run: |
          test -s music-foundry/output/warehouse-rave-v3/manifest.json
          test -s music-foundry/output/warehouse-rave-v3/chords.mid
          test -s music-foundry/output/warehouse-rave-v3/bass.mid
          test -s music-foundry/output/warehouse-rave-v3/lead.mid
          test -s music-foundry/output/warehouse-rave-v3/drums.mid
          test -s music-foundry/output/warehouse-rave-v3/texture.mid
      - name: Render Warehouse Rave V3 composition audition through existing synth
        run: |
          python3 music-foundry/render_warehouse_rave_v3.py --output music-foundry/output/warehouse-rave-v3-audio --bpm 127
          test -s music-foundry/output/warehouse-rave-v3-audio/instrumental_mix.wav
          test -s music-foundry/output/warehouse-rave-v3-audio/drums.wav
          test -s music-foundry/output/warehouse-rave-v3-audio/bass.wav
          test -s music-foundry/output/warehouse-rave-v3-audio/lead.wav
          test -s music-foundry/output/warehouse-rave-v3-audio/chords.wav
          test -s music-foundry/output/warehouse-rave-v3-audio/texture.wav
      - name: Generate provisional chorus melody audition MIDI
        run: |
          python3 music-foundry/build_chorus_melody_preview.py --output music-foundry/output/somebodys-gotta-do-it/chorus_melody_concept_a.mid
          test -s music-foundry/output/somebodys-gotta-do-it/chorus_melody_concept_a.mid
      - name: Render offline instrumental WAV preview
        run: python3 music-foundry/render_instrumental.py --output music-foundry/output/somebodys-gotta-do-it-audio --bpm 127
      - name: Verify rendered WAV headers and durations
        run: |
          python3 - <<'PY'
          import json, wave
          from pathlib import Path
          for folder in [Path("music-foundry/output/warehouse-rave-v3-audio"), Path("music-foundry/output/somebodys-gotta-do-it-audio")]:
              manifest = json.loads((folder / "audio_manifest.json").read_text())
              mix = folder / manifest.get("mix", "instrumental_mix.wav")
              assert mix.stat().st_size > 4096, f"placeholder or empty audio: {mix}"
              with wave.open(str(mix), "rb") as audio:
                  assert audio.getnframes() > audio.getframerate() * 10, f"audio too short: {mix}"
                  assert audio.getnchannels() in (1, 2)
                  assert audio.getsampwidth() == 2
                  print(f"{mix}: {audio.getnchannels()}ch, {audio.getframerate()}Hz, {audio.getnframes()/audio.getframerate():.2f}s")
          PY
      - name: Upload lyric event manifest
        uses: actions/upload-artifact@v4
        with:
          name: somebodys-gotta-do-it-lyric-events
          path: music-foundry/output/somebodys-gotta-do-it/lyric-events.json
      - name: Upload Warehouse Rave V3 audition
        uses: actions/upload-artifact@v4
        with:
          name: warehouse-rave-v3-audition
          path: music-foundry/output/warehouse-rave-v3-audio/
      - name: Upload MIDI preview files
        uses: actions/upload-artifact@v4
        with:
          name: music-foundry-midi-demo
          path: music-foundry/output/
