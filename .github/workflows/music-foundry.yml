name: Music Foundry MIDI tests
on:
  push:
    paths:
      - 'music-foundry/**'
      - '.github/workflows/music-foundry.yml'
  pull_request:
    paths:
      - 'music-foundry/**'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python3 -m unittest discover -s music-foundry/tests -v
      - name: Generate Fine China full-length MIDI arrangement
        run: python3 music-foundry/generate.py --output music-foundry/output/fine-china --bpm 126 --bars 120
      - name: Run Fine China production preflight (blocked stages are reported, not hidden)
        run: |
          python3 music-foundry/song_pipeline.py --project music-foundry/projects/fine-china --output music-foundry/output/fine-china || test -f music-foundry/output/fine-china/pipeline-report.json
      - name: Upload Fine China MIDI project and production report
        uses: actions/upload-artifact@v4
        with:
          name: fine-china-production-preflight
          path: music-foundry/output/fine-china/
