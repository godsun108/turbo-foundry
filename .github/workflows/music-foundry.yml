name: Music Foundry MIDI tests
on:
  push:
    paths:
      - 'music-foundry/**'
      - '.github/workflows/music-foundry.yml'
  pull_request:
    paths:
      - 'music-foundry/**'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python3 -m unittest discover -s music-foundry/tests -v
      - name: Syntax-check browser audio editors
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          files = [
              Path("music-foundry/projects/somebodys-gotta-do-it/recording-booth.html"),
              Path("music-foundry/projects/somebodys-gotta-do-it/vocal-timeline.html"),
          ]
          for source in files:
              html = source.read_text(encoding="utf-8")
              scripts = re.findall(r'<script>(.*?)</script>', html, re.S)
              if not scripts:
                  raise SystemExit(f"No inline script found in {source}")
              Path(f"/tmp/{source.stem}.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/recording-booth.js
          node --check /tmp/vocal-timeline.js
      - name: Syntax-check vocal score editor module
        run: node --check --input-type=module < music-foundry/projects/somebodys-gotta-do-it/vocal-score-editor.js
      - name: Test SoulX phone inventory
        run: node --test music-foundry/tests/test_soulx_phone_inventory.mjs
      - name: Syntax-check Genesis Voice Studio modules
        run: |
          node --check music-foundry/projects/somebodys-gotta-do-it/genesis-voice-studio.js
          node --check --input-type=module < music-foundry/projects/somebodys-gotta-do-it/genesis-voice-worker.js
      - name: Generate MIDI
        run: python3 music-foundry/generate.py --output music-foundry/output
      - name: Generate Somebody's Gotta Do It arrangement
        run: python3 music-foundry/arrange_project.py --output music-foundry/output/somebodys-gotta-do-it --bpm 127
      - name: Generate Warehouse Rave V3 composition preview
        run: python3 music-foundry/warehouse_rave_v3.py --output music-foundry/output/warehouse-rave-v3 --bpm 127
      - name: Verify Warehouse Rave V3 mix and stems
        run: |
          test -s music-foundry/output/warehouse-rave-v3/instrumental_mix.wav
          test -s music-foundry/output/warehouse-rave-v3/audio_manifest.json
          for stem in drums bass synth lead fx; do
            test -s "music-foundry/output/warehouse-rave-v3/$stem.wav"
          done
      - name: Generate provisional chorus melody audition MIDI
        run: |
          python3 music-foundry/build_chorus_melody_preview.py --output music-foundry/output/somebodys-gotta-do-it/chorus_melody_concept_a.mid
          test -s music-foundry/output/somebodys-gotta-do-it/chorus_melody_concept_a.mid
      - name: Render offline instrumental WAV preview
        run: python3 music-foundry/render_instrumental.py --output music-foundry/output/somebodys-gotta-do-it-audio --bpm 127
      - name: Upload MIDI and audio preview files
        uses: actions/upload-artifact@v4
        with:
          name: music-foundry-midi-demo
          path: music-foundry/output/
